<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball Z - Treino & Batalha Fácil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #09090e 0%, #1a1a2e 100%);
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #ff8800;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 136, 0, 0.6);
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 4px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Cartão de Estatísticas */
        .card-guerreiro {
            background: #14141f;
            border: 2px solid #ff5500;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.3);
        }

        .status-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .nome-guerreiro {
            font-weight: bold;
            font-size: 1.05rem;
            color: #ffaa00;
        }

        .transformacao {
            background: #ff5500;
            color: #fff;
            padding: 3px 8px;
            font-size: 0.7rem;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .barra-container {
            background: #222233;
            border-radius: 10px;
            height: 14px;
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
            border: 1px solid #444;
        }

        .barra-ki {
            background: linear-gradient(90deg, #ff5500, #ffea00);
            height: 100%;
            width: 0%;
            transition: width 0.15s ease;
        }

        .info-numeros {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #ccc;
            margin-top: 5px;
        }

        /* Secção de Treino */
        .secao-treino {
            background: #14141f;
            border: 1px solid #33334d;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .btn-acao {
            background: linear-gradient(135deg, #ff5500, #ff0055);
            color: #fff;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 85, 0, 0.4);
            transition: transform 0.1s;
            width: 100%;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-acao:active {
            transform: scale(0.95);
        }

        /* Arena de Batalha */
        .arena-batalha {
            background: #14141f;
            border: 2px solid #9900ff;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 0 15px rgba(153, 0, 255, 0.3);
        }

        .inimigo-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .nome-inimigo {
            color: #cc66ff;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .barra-vida-inimigo {
            background: #222233;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #551a8b;
        }

        .progresso-vida {
            background: linear-gradient(90deg, #9900ff, #ff0055);
            height: 100%;
            width: 100%;
            transition: width 0.2s ease;
        }

        .btn-atacar {
            background: linear-gradient(135deg, #9900ff, #ff0055);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(153, 0, 255, 0.4);
            text-transform: uppercase;
        }

        .btn-atacar:active {
            transform: scale(0.95);
        }

        /* Log de Combate */
        .log-combate {
            background: #0a0a0f;
            border: 1px solid #222233;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.8rem;
            color: #00ffcc;
            min-height: 45px;
            text-align: center;
        }

        footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.75rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>DBZ: Poder Absoluto</h1>
        <p>Modo Fácil • Toque para evoluir rápido!</p>
    </header>

    <div class="container">
        <!-- Estatísticas do Goku -->
        <div class="card-guerreiro">
            <div class="status-topo">
                <span class="nome-guerreiro">Goku</span>
                <span class="transformacao" id="transfTexto">Forma Base</span>
            </div>
            <div class="info-numeros">
                <span>Ki Atual:</span>
                <span id="kiTexto" style="color: #ffaa00; font-weight: bold;">0 / 5.000</span>
            </div>
            <div class="barra-container">
                <div class="barra-ki" id="barraKiPreenchida"></div>
            </div>
        </div>

        <!-- Secção de Treinamento -->
        <div class="secao-treino">
            <button class="btn-acao" onclick="treinarKi()">⚡ Concentrar Ki (+2.500)</button>
        </div>

        <!-- Arena de Batalha -->
        <div class="arena-batalha">
            <div class="inimigo-topo">
                <span class="nome-inimigo">Boss: Vegeta</span>
                <span id="nivelBoss" style="font-size: 0.8rem; color: #aaa;">Derrotas: 0</span>
            </div>
            <div class="info-numeros">
                <span>HP do Vegeta:</span>
                <span id="hpTexto" style="color: #cc66ff; font-weight: bold;">50 / 50</span>
            </div>
            <div class="barra-vida-inimigo">
                <div class="progresso-vida" id="barraVidaBoss"></div>
            </div>
            <button class="btn-atacar" onclick="atacarBoss()">🔥 Kamehameha Instantâneo!</button>
        </div>

        <!-- Registo -->
        <div class="log-combate" id="logCombate">
            Toque em Concentrar Ki para começar a treinar!
        </div>
    </div>

    <footer>
        <p>GitHub Pages • Jogo Otimizado para Telemóvel</p>
    </footer>

    <script>
        let ki = 0;
        let kiMax = 5000;
        let nivelTransformacao = 0;
        let hpBoss = 50;
        let hpMaxBoss = 50;
        let vitorias = 0;

        const transformacoes = [
            { nome: "Forma Base", max: 5000 },
            { nome: "Kaioken", max: 15000 },
            { nome: "Super Saiyajin", max: 40000 },
            { nome: "Super Saiyajin Blue", max: 100000 }
        ];

        function atualizarInterface() {
            let porcentagemKi = (ki / kiMax) * 100;
            if (porcentagemKi > 100) porcentagemKi = 100;
            document.getElementById('barraKiPreenchida').style.width = porcentagemKi + '%';
            document.getElementById('kiTexto').innerText = ki.toLocaleString('pt-PT') + ' / ' + kiMax.toLocaleString('pt-PT');

            if (ki >= kiMax && nivelTransformacao < transformacoes.length - 1) {
                nivelTransformacao++;
                kiMax = transformacoes[nivelTransformacao].max;
                document.getElementById('transfTexto').innerText = transformacoes[nivelTransformacao].nome;
                adicionarLog("✨ Nova Transformação: " + transformacoes[nivelTransformacao].nome + "!");
            }

            let porcentagemVida = (hpBoss / hpMaxBoss) * 100;
            document.getElementById('barraVidaBoss').style.width = porcentagemVida + '%';
            document.getElementById('hpTexto').innerText = hpBoss + ' / ' + hpMaxBoss;
        }

        function treinarKi() {
            let ganho = 2500 * (nivelTransformacao + 1);
            ki += ganho;
            adicionarLog("⚡ Treino bem-sucedido! +" + ganho.toLocaleString('pt-PT') + " de Ki.");
            atualizarInterface();
        }

        function atacarBoss() {
            let dano = 50 * (nivelTransformacao + 1);
            hpBoss -= dano;

            if (hpBoss <= 0) {
                hpBoss = 0;
                vitorias++;
                hpMaxBoss += 25;
                hpBoss = hpMaxBoss;
                adicionarLog("🏆 Vitória #" + vitorias + "! Derrotaste o Vegeta facilmente!");
                document.getElementById('nivelBoss').innerText = "Derrotas: " + vitorias;
            } else {
                adicionarLog("💥 Kamehameha! Causaste " + dano + " de dano ao Vegeta.");
            }
            atualizarInterface();
        }

        function adicionarLog(mensagem) {
            document.getElementById('logCombate').innerText = mensagem;
        }

        atualizarInterface();
    </script>

</body>
</html>
