<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS Mobile - Tactical Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #hud {
            position: absolute;
            top: 10px;
            width: 90%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        #gameCanvas {
            background: #2b2b2b;
            border: 2px solid #555;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: block;
        }

        /* Controlos Táticos no Ecrã */
        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 90%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(3, 45px);
            gap: 5px;
        }

        .btn-dir {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-dir:active {
            background: rgba(255, 255, 255, 0.4);
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-fire {
            background: radial-gradient(circle, #ff3300, #990000);
            border: 2px solid #ff6666;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .btn-reload {
            background: #333;
            border: 1px solid #666;
            padding: 8px 12px;
            border-radius: 15px;
            color: #ccc;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .btn-fire:active, .btn-reload:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div id="hud">
        <span style="color: #00ffcc;">HP: <span id="hpVal">100</span></span>
        <span style="color: #ffcc00;">BALAS: <span id="ammoVal">30/30</span></span>
        <span style="color: #ff3300;">INIMIGOS: <span id="enemiesVal">3</span></span>
    </div>

    <canvas id="gameCanvas" width="360" height="420"></canvas>

    <div class="controls-container">
        <!-- Digital D-Pad -->
        <div class="dpad">
            <div></div>
            <div class="btn-dir" id="btnUp">▲</div>
            <div></div>
            <div class="btn-dir" id="btnLeft">◄</div>
            <div></div>
            <div class="btn-dir" id="btnRight">►</div>
            <div></div>
            <div class="btn-dir" id="btnDown">▼</div>
            <div></div>
        </div>

        <!-- Botões de Ação -->
        <div class="action-btns">
            <button class="btn-fire" id="btnFire">FOGO</button>
            <button class="btn-reload" id="btnReload">RECARREGAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Estado do Jogador (Contra-Terrorista)
        let player = {
            x: 180,
            y: 360,
            radius: 12,
            color: '#00ccff',
            speed: 2.5,
            hp: 100,
            angle: 0
        };

        // Arma & Munição
        let ammo = 30;
        let maxAmmo = 30;
        let isReloading = false;

        // Balas e Inimigos (Terroristas)
        let bullets = [];
        let enemies = [];
        let keys = { up: false, down: false, left: false, right: false };

        // Obstáculos / Paredes do Mapa
        const walls = [
            { x: 50, y: 100, w: 100, h: 20 },
            { x: 210, y: 100, w: 100, h: 20 },
            { x: 130, y: 220, w: 100, h: 20 }
        ];

        function spawnEnemies() {
            enemies = [
                { x: 60, y: 50, hp: 40, color: '#ff3333', angle: 0 },
                { x: 180, y: 50, hp: 40, color: '#ff3333', angle: 0 },
                { x: 300, y: 50, hp: 40, color: '#ff3333', angle: 0 }
            ];
        }

        // Configuração dos Botões Táteis
        function setupTouchControl(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => { keys[keyName] = true; });
            btn.addEventListener('mouseup', () => { keys[keyName] = false; });
        }

        setupTouchControl('btnUp', 'up');
        setupTouchControl('btnDown', 'down');
        setupTouchControl('btnLeft', 'left');
        setupTouchControl('btnRight', 'right');

        document.getElementById('btnFire').addEventListener('click', shoot);
        document.getElementById('btnFire').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
        document.getElementById('btnReload').addEventListener('click', reload);

        function shoot() {
            if (isReloading || ammo <= 0 || player.hp <= 0) return;

            ammo--;
            updateHUD();

            // Disparar na direção para onde o jogador está virado (ou para cima por padrão)
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(player.angle) * 7,
                vy: Math.sin(player.angle) * 7
            });
        }

        function reload() {
            if (isReloading || ammo === maxAmmo) return;
            isReloading = true;
            document.getElementById('ammoVal').innerText = "RECARREGANDO...";
            setTimeout(() => {
                ammo = maxAmmo;
                isReloading = false;
                updateHUD();
            }, 1500);
        }

        function updateHUD() {
            document.getElementById('hpVal').innerText = player.hp;
            if (!isReloading) document.getElementById('ammoVal').innerText = ammo + '/' + maxAmmo;
            document.getElementById('enemiesVal').innerText = enemies.length;
        }

        function update() {
            if (player.hp <= 0) return;

            // Movimento do Jogador
            let dx = 0, dy = 0;
            if (keys.up) dy -= player.speed;
            if (keys.down) dy += player.speed;
            if (keys.left) dx -= player.speed;
            if (keys.right) dx += player.speed;

            if (dx !== 0 || dy !== 0) {
                player.angle = Math.atan2(dy, dx);
                player.x = Math.max(15, Math.min(canvas.width - 15, player.x + dx));
                player.y = Math.max(15, Math.min(canvas.height - 15, player.y + dy));
            }

            // Atualizar Balas
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Colisão das Balas com os Inimigos
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < 15) {
                        e.hp -= 20;
                        bullets.splice(i, 1);
                        if (e.hp <= 0) enemies.splice(j, 1);
                        updateHUD();
                        break;
                    }
                }

                // Remover balas fora do ecrã
                if (b && (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height)) {
                    bullets.splice(i, 1);
                }
            }

            // IA dos Inimigos (Moverem-se e Atacarem o Jogador)
            enemies.forEach(e => {
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * 0.8;
                e.y += Math.sin(angle) * 0.8;

                // Ataque do inimigo ao encostar no jogador
                let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer < 20) {
                    player.hp -= 0.5;
                    if (player.hp < 0) player.hp = 0;
                    updateHUD();
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Paredes / Obstáculos
            ctx.fillStyle = '#444';
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
            });

            // Desenhar Balas
            ctx.fillStyle = '#ffcc00';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Desenhar Inimigos (Terroristas)
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
                ctx.fill();
            });

            // Desenhar Jogador (Contra-Terrorista)
            if (player.hp > 0) {
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();

                // Direção da Arma
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x + Math.cos(player.angle) * 20, player.y + Math.sin(player.angle) * 20);
                ctx.stroke();
            } else {
                // Fim de Jogo
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3300';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('TERRORISTAS VENCERAM', canvas.width / 2, canvas.height / 2);
            }

            // Vitória
            if (enemies.length === 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('CONTRA-TERRORISTAS VENCERAM!', canvas.width / 2, canvas.height / 2);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        spawnEnemies();
        updateHUD();
        gameLoop();
    </script>
</body>
</html>
